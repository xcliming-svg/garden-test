<!doctype html>
<html lang="ko" data-playable="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Garden Test</title>
  <link rel="stylesheet" href="./assets/fonts/fusion.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0D0D0E; /* GardenPalette.hex.ink: startup fallback */ }
    body { display: flex; align-items: center; justify-content: center; font-family: "Garden Fusion", sans-serif; overflow: hidden; }
    #game { width: 960px; height: 540px; flex: none; position: relative; }
    #game canvas { display: block; image-rendering: auto; }
  </style>
</head>
<body>
  <main id="game" aria-label="Garden Test 게임 씬 화면"></main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    if (location.search) {
      const params = new URLSearchParams(location.search);
      const pairs = params.get('slotPairs');
      const preview = pairs === '9' || pairs === '10' ? '?slotPairs=' + pairs : '';
      history.replaceState(null, '', location.pathname + preview + location.hash);
    }
  </script>
  <script src="./src/campaign-v3.js"></script>
  <script src="./src/fairy-flowerbeds.js"></script>
  <script src="./src/run-rules.js"></script>
  <script src="./src/flower-carry.js"></script>
  <script src="./src/palette.js"></script>
  <script src="./src/svg-palette.js"></script>
  <script src="./src/ui.js"></script>
  <script src="./src/test-sprites.js"></script>
  <script src="./src/flower-damage.js"></script>
  <script src="./src/flower-growth.js"></script>
  <script src="./src/combat-preview.js"></script>
  <script src="./src/loot-preview.js"></script>
  <script src="./src/stone-border-preview.js"></script>
  <script src="./src/patrol-path-preview.js"></script>
  <script src="./src/dashed-grid-preview.js"></script>
  <script src="./src/light-field-preview.js"></script>
  <script src="./src/dark-field-preview.js"></script>
  <script src="./src/guardian-walk-preview.js"></script>
  <script src="./src/pebble-boundary.js"></script>
  <script src="./src/fairy-patrol.js"></script>
  <script src="./src/enemy-motion.js"></script>
  <script src="./src/enemy-occlusion.js"></script>
  <script src="./src/fairy-attack.js"></script>
  <script src="./src/weapon-balance.js"></script>
  <script src="./src/enemy-preview.js"></script>
  <script src="./src/flower-head-preview.js"></script>
  <script src="./src/item-cards.js"></script>
  <script src="./src/hero-weapon-preview.js"></script>
  <script src="./src/relic-collection.js"></script>
  <script src="./src/game-layout.js"></script>
  <script src="./src/slot-pairs-demo.js"></script>
  <script src="./src/run-drops.js"></script>
  <script src="./src/scenes.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
