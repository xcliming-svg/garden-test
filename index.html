<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Garden Test | Scene Prototype</title>
  <link rel="stylesheet" href="./assets/fonts/fusion.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0D0D0D; /* GardenPalette.background: startup fallback */ }
    body { display: flex; align-items: center; justify-content: center; font-family: "Garden Fusion", sans-serif; overflow: hidden; }
    #game { width: 960px; height: 540px; flex: none; }
    #game canvas { display: block; image-rendering: auto; }
  </style>
</head>
<body>
  <main id="game" aria-label="Garden Test 게임 씬 화면"></main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./src/palette.js"></script>
  <script src="./src/ui.js"></script>
  <script src="./src/test-sprites.js"></script>
  <script src="./src/combat-preview.js"></script>
  <script src="./src/loot-preview.js"></script>
  <script src="./src/flower-head-preview.js"></script>
  <script src="./src/game-layout.js"></script>
  <script src="./src/scenes.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
