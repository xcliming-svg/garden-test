<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden 카드 패딩 비교</title><link rel="stylesheet" href="./assets/fonts/fusion.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#191B19;color:#F1F0E8;font:16px/1.6 "Garden Fusion",sans-serif}main{max-width:920px;margin:auto;padding:24px}h1{font-size:24px}h2{font-size:18px;margin-top:28px}p{color:#C0C1B7}a{color:#B3D96A}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.sample{border:1px solid #45483D;padding:12px;text-align:center}.sample.current{border-color:#B3D96A}canvas{display:block;margin:12px auto;image-rendering:pixelated;max-width:100%;height:auto}.sample small{color:#C0C1B7}button,select{font:inherit;color:inherit;background:#343D30;border:1px solid #777D6D;padding:8px 12px}button{cursor:pointer}table{border-collapse:collapse;width:100%}th,td{padding:8px;text-align:left;border-bottom:1px solid #45483D}#status{min-height:2em}label{display:inline-block;margin-right:8px}</style></head><body><main>
<a href="./index.html">기존 게임 화면</a><h1>카드 패딩 비교 · 테스트 전용</h1><p>내부 아이콘 16×16, 외곽선 1px 고정. 실제 데모의 손수레와 데이지 픽셀, 동일한 팔레트 사용. 외형 = 16 + 2 × (패딩 + 1).</p>
<label for="scale">표시 배율</label><select id="scale"><option value="1">1배</option><option value="2">2배</option><option value="3" selected>3배</option><option value="4">4배</option></select>
<div class="grid" id="samples"></div>
<h2>외곽선 그리기 시간 비교</h2><p>동일한 카드 면을 Canvas 2D의 두 사각형 채움 또는 면+네 변 채움으로 그립니다. 7회 중앙값, 회당 10,000장. 아이콘·Phaser·GPU 프레임 시간은 포함하지 않습니다. 브라우저에서 직접 실행한 결과만 표시합니다.</p>
<button id="run">시간 측정 실행</button><p id="status" role="status">미실행</p><table><thead><tr><th>패딩 / 외형</th><th>채움 2회</th><th>면+외곽 5회</th></tr></thead><tbody id="results"></tbody></table>
</main><script src="./src/palette.js"></script><script src="./src/test-sprites.js"></script><script src="./src/card-compare.js"></script></body></html>
