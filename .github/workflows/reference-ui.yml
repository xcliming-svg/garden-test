name: Reference UI browser regression
on:
  push:
    branches: [feature/reference-ui, feature/blueprint-gap-3px, feature/bottom-visible-gap-3px, feature/devel-blueprint-gap-1px, feature/devel-blueprint-gap-restore-3px, feature/devel-unify-panel-style, feature/devel-hud-menu-consistency, feature/devel-ui-palette-16, feature/devel-shared-game16, feature/devel-garden16-reference-tone, feature/tooltip-visible-gap-5px, feature/devel-garden-shared-grid, feature/devel-garden-cut-corners]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium test dependencies
        run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0 fontkit@2.0.4
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Run real browser reference UI regression
        run: node tests/reference-ui.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-ui-regression
          path: benchmark-results
