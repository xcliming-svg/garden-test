name: 50-stage campaign research
on:
  push:
    branches: [feature/campaign-50-study]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stage: [1, 3, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node simulation/experiments/campaign-50.mjs screen ${{ matrix.stage }} /tmp/campaign.json
      - uses: actions/upload-artifact@v4
        with:
          name: screen-${{ matrix.stage }}
          path: /tmp/campaign.json
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stage: [3, 15, 30, 45]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node simulation/experiments/campaign-50.mjs profile ${{ matrix.stage }} /tmp/profiles.json
      - uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.stage }}
          path: /tmp/profiles.json
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/campaign-50-model.mjs && node tests/simulation-model.mjs && node tests/stage-gear-model.mjs
