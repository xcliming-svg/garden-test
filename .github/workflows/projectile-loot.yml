name: Projectile loot verification
on:
  push:
    branches: [feature/devel-projectile-loot, feature/devel-pink-guardian, feature/devel-guardian-38, feature/devel-full-garden, feature/devel-stone-border, feature/devel-size-parameters, feature/devel-dashed-patrol]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node --check src/patrol-path-preview.js && node --check src/stone-border-preview.js && node --check src/combat-preview.js && node --check src/loot-preview.js && node --check src/flower-head-preview.js && node --check src/game-layout.js && node --check tests/projectile-loot.mjs
      - run: node tests/projectile-loot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projectile-loot
          path: benchmark-results
