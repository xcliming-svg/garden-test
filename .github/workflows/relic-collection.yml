name: Relic collection verification
on:
  push:
    branches: [feature/loot-collection, devel]
permissions:
  contents: read
jobs:
  relics:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in src/*.js tests/relic-*.mjs; do node --check "$file"; done
      - run: node tests/relic-collection.mjs
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/relic-browser.mjs
