name: Early pace independent verification
on:
  push:
    branches: [feature/early-pace-optimization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check simulation/experiments/early-pace-search.mjs
      - run: node tests/early-pace-model.mjs
      - run: node tests/simulation-model.mjs && node tests/blueprint-selection-model.mjs
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        map: [classic, cross, heart]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/early-pace-browser.mjs ${{ matrix.map }} /tmp/pace-reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pace-reference-${{ matrix.map }}
          path: /tmp/pace-reference.json
