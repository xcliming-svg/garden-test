name: Main-based paired slot HUD
on:
  push:
    branches: [feature/main-paired-slot-hud-34, feature/devel-hud-stats-spacing, feature/devel-hud-visual-justification, feature/devel-hud-equal-thirds, feature/devel-hud-three-80px-columns, devel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for file in src/*.js tests/*.mjs; do node --check "$file"; done
      - run: node tests/playable-run-model.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false phaser@3.90.0 playwright@1.51.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/paired-slot-hud-browser.mjs
      - run: node tests/playable-run-browser.mjs
