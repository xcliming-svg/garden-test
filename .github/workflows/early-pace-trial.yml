name: Devel early pace trial verification
on:
  push:
    branches: [feature/devel-early-pace-trial, devel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/early-pace-trial-model.mjs && node tests/playable-run-model.mjs && node tests/simulation-model.mjs && node tests/blueprint-selection-model.mjs
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/early-pace-trial-browser.mjs
