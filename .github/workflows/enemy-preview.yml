name: Enemy animal preview verification
on:
  push:
    branches: [feature/enemy-animal-preview]
permissions:
  contents: read
jobs:
  enemy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: for file in src/*.js tests/enemy-preview.mjs; do node --check "$file"; done
      - run: node tests/enemy-preview.mjs
      - run: node tests/fairy-patrol.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enemy-preview
          path: benchmark-results
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/projectile-loot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enemy-combat-regression
          path: benchmark-results
