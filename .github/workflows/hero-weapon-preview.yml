name: Hero weapon preview verification
on:
  push:
    branches: [feature/hero-weapon-preview, feature/weapon-balance-v1, devel]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in src/*.js tests/hero-weapon-*.mjs tests/weapon-balance-model.mjs; do node --check "$file"; done
      - run: node tests/hero-weapon-model.mjs
      - run: node tests/weapon-balance-model.mjs
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/hero-weapon-browser.mjs
