name: Fairy flower carry experiment
on:
  push:
    branches: [feature/fairy-flower-carry, feature/keyboard-installation-fifo]
  pull_request:
    branches: [main, devel]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for f in src/*.js tests/fairy-flower-carry-*.mjs; do node --check "$f"; done
          node tests/fairy-flower-carry-model.mjs
          node tests/campaign-v3-model.mjs
          node tests/playable-run-model.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false phaser@3.90.0 playwright@1.51.1
      - run: node tests/fairy-flower-carry-browser.mjs
      - run: node tests/playable-run-browser.mjs
      - run: node tests/campaign-v3-browser.mjs
