name: Blueprint balance baseline
on:
  push:
    branches: [feature/blueprint-balance-baseline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: maps, runs: 12, seed: 101, dt: '.05', seconds: 900}
          - {group: flowers, runs: 12, seed: 101, dt: '.05', seconds: 900}
          - {group: growth, runs: 12, seed: 101, dt: '.05', seconds: 900}
          - {group: builds, runs: 12, seed: 101, dt: '.05', seconds: 900}
          - {group: levels, runs: 12, seed: 101, dt: '.05', seconds: 900}
          - {group: swarm, runs: 5, seed: 101, dt: '.05', seconds: 600}
          - {group: fixed-combat, runs: 5, seed: 101, dt: '.05', seconds: 90}
          - {group: maps, runs: 5, seed: 101, dt: '.025', seconds: 900}
          - {group: stages, runs: 12, seed: 401, dt: '.05', seconds: 900}
          - {group: formations, runs: 8, seed: 601, dt: '.05', seconds: 900}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/blueprint-selection-model.mjs && node tests/formation-model.mjs
      - run: node simulation/experiments/blueprint-baseline.mjs --group ${{ matrix.group }} --runs ${{ matrix.runs }} --seed ${{ matrix.seed }} --dt ${{ matrix.dt }} --seconds ${{ matrix.seconds }} --output /tmp/study.json
      - run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {concise} from './simulation/experiments/blueprint-baseline.mjs'; for(const r of concise(JSON.parse(readFileSync('/tmp/study.json')))) console.log('STUDY '+JSON.stringify(r))"
      - uses: actions/upload-artifact@v4
        with:
          name: study-${{ matrix.group }}-${{ matrix.dt }}
          path: /tmp/study.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/blueprint-selection-browser.mjs
      - run: node tests/formation-browser.mjs
      - run: node tests/playable-run-browser.mjs
