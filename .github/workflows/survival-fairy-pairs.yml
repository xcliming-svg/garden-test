name: Survival garden and paired water fairies
on:
  push:
    branches: [feature/devel-survival-fairy-pairs, feature/devel-survival-ci-compat, devel, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for file in src/*.js tests/*.mjs; do node --check "$file"; done
      - run: node tests/survival-fairy-pairs-model.mjs
      - run: node tests/playable-run-model.mjs
      - run: node tests/simulation-model.mjs && node tests/blueprint-selection-model.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false phaser@3.90.0 playwright@1.51.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/survival-fairy-pairs-browser.mjs
