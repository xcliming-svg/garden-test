name: White floating drops browser regression

on:
  push:
    branches: [feature/white-floating-drops]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned benchmark dependencies
        run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Syntax check benchmark
        run: node --check tests/floating-drops.mjs
      - name: Compare actual Chromium/Phaser candidates
        run: node tests/floating-drops.mjs
      - name: Upload screenshots and metric report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-drops-regression
          path: benchmark-results
