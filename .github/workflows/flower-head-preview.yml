name: Flower head preview verification
on:
  push:
    branches: [feature/flower-head-preview]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node --check src/flower-head-preview.js && node --check src/game-layout.js && node --check tests/flower-head-preview.mjs
      - run: node tests/flower-head-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flower-head-preview
          path: benchmark-results
