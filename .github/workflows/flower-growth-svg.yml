name: SVG flower growth verification
on:
  push:
    branches: [feature/flower-growth-svg-damage, feature/devel-flower-stage1-double, feature/devel-flower-three-stages, feature/devel-flower-wilt, feature/devel-fairy-patrol]
  pull_request:
    branches: [devel]
permissions:
  contents: read
jobs:
  svg:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: for file in src/*.js tests/flower-growth-svg.mjs tests/fairy-patrol.mjs; do node --check "$file"; done
      - run: node scripts/recolor-svg.mjs
      - run: node tests/flower-growth-svg.mjs
      - run: node tests/fairy-patrol.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-growth
          path: benchmark-results
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/projectile-loot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projectile-loot-regression
          path: benchmark-results
