name: Temporary terrain preview smoke test
on:
  push:
    branches: [test/terrain-grass-soil-preview]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 phaser@3.90.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/terrain-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-preview
          path: terrain-preview*.png
